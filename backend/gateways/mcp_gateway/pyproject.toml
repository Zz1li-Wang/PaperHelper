[project]
name = "paper-helper-mcp-gateway"
version = "0.1.0"
description = "Stateless FastMCP gateway for Paper Helper domain services"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastmcp==4.0.4",
    "pydantic-settings>=2.10,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_helper_mcp_gateway"]
