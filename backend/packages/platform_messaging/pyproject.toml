[project]
name = "paper-helper-messaging"
version = "0.1.0"
description = "RabbitMQ transport primitives for Paper Helper Python services"
requires-python = ">=3.12,<3.14"
dependencies = [
    "aio-pika>=9.5,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_helper_messaging"]
