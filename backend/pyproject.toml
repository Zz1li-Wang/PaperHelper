[project]
name = "paper-helper-backend-workspace"
version = "0.1.0"
description = "Python microservice workspace for Paper Helper"
requires-python = ">=3.12,<3.14"
dependencies = []

[dependency-groups]
dev = [
    "alembic>=1.16,<2",
    "jsonschema>=4.26,<5",
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.2,<2",
    "ruff>=0.12,<1",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "gateways/*",
    "packages/*",
    "services/*",
]

[tool.pytest.ini_options]
testpaths = ["tests", "gateways", "packages", "services", "../tests/contracts"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
