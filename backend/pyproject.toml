[project]
name = "paper-helper-backend"
version = "0.1.0"
description = "Python backend and MCP gateway for Paper Helper"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastmcp==4.0.4",
    "pydantic-settings>=2.10,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.2,<2",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_helper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
