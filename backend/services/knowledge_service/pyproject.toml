[project]
name = "paper-helper-knowledge-service"
version = "0.1.0"
description = "Source, ingestion, document, and retrieval bounded contexts"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.16,<2",
    "asyncpg>=0.30,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_service"]
