[project]
name = "paper-helper-research-core"
version = "0.1.0"
description = "Workspace, research state, and artifact bounded contexts"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.16,<2",
    "asyncpg>=0.30,<1",
    "fastapi>=0.115,<1",
    "pydantic>=2,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn>=0.34,<1",
]

# 服务自己的测试依赖：TestClient / ASGITransport 走 httpx。
[dependency-groups]
dev = ["httpx>=0.27,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_core"]
