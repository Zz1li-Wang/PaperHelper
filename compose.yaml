name: paper-helper

services:
  rabbitmq:
    image: rabbitmq:4.3.6-management
    hostname: paper-helper-rabbitmq
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PAPER_HELPER_RABBITMQ_AMQP_PORT:-5672}:5672"
      - "127.0.0.1:${PAPER_HELPER_RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./deploy/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./deploy/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  rabbitmq-data:
